<!doctype html>
<!-- PokeSwarm UI Library: the board (dev tool, never ships; #155, Jess's mockup assets/excalidraw/pokeswarm-library-html.excalidraw).
     The shared language between Jess and the assistant: every token and piece by name. It loads only the library's own files
     (js/ui/lib/) and its data (tools/library/), never the game's scripts, and draws pieces with placeholder data.
     Open it by double-click (file://). Checked by tools/smoke-ui-library.js. Plan: docs/ASCII Concept Maps/155 - UI Library v2 Build Plan.md.
     Pages are linked by the address hash (#tokens/colours), so a page can be bookmarked or sent. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokeSwarm UI Library</title>
<style>
  /* The board's own chrome: neutral greys, so the game's colours read true. */
  :root { --lib-bg: #15171c; --lib-panel: #1e2128; --lib-line: #2e323b; --lib-text: #e4e6eb; --lib-dim: #8b919c;
    --lib-accent: #6ea4ff; --lib-sidebar: 250px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--lib-bg); color: var(--lib-text); font: 14px/1.45 system-ui, sans-serif; display: flex;
    flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--lib-line); }
  header h1 { font-size: 18px; margin: 0; }
  header .lib-crumb { color: var(--lib-dim); font-size: 13px; }
  button { font: inherit; color: inherit; }
  .lib-body { flex: 1; display: flex; min-height: 0; }

  /* ---------- sidebar ---------- */
  nav#sidebar { width: var(--lib-sidebar); flex: none; border-right: 1px solid var(--lib-line); overflow-y: auto;
    padding: 10px 8px 24px; }
  body.sidebar-closed nav#sidebar { display: none; }
  #toggle-sidebar { background: none; border: 1px solid var(--lib-line); border-radius: 4px; padding: 2px 8px;
    cursor: pointer; color: var(--lib-dim); }
  #toggle-sidebar:hover { color: var(--lib-text); }
  .nav-group > summary { list-style: none; cursor: pointer; font-weight: 600; padding: 6px 8px; border: 1px solid var(--lib-line);
    border-radius: 6px; margin: 8px 0 4px; display: flex; justify-content: space-between; }
  .nav-group > summary::-webkit-details-marker { display: none; }
  .nav-group > summary::after { content: '+'; color: var(--lib-dim); }
  .nav-group[open] > summary::after { content: '\2212'; }
  .nav-group .nav-group { margin-left: 12px; }
  .nav-group .nav-group > summary { font-weight: 500; margin: 4px 0; }
  .nav-item { display: block; width: calc(100% - 12px); margin: 3px 0 3px 12px; text-align: left; background: none;
    border: 1px solid var(--lib-line); border-radius: 4px; padding: 4px 8px; cursor: pointer; }
  .nav-item:hover { border-color: var(--lib-accent); }
  .nav-item[aria-current="page"] { background: var(--lib-panel); border-color: var(--lib-accent); }
  .nav-item.is-later { color: var(--lib-dim); }
  .nav-item.is-top { margin-left: 0; width: 100%; font-weight: 600; padding: 6px 8px; border-radius: 6px; margin-top: 8px; }

  /* ---------- main area ---------- */
  main { flex: 1; overflow-y: auto; padding: 16px 24px 48px; min-width: 0; }
  main h2 { margin: 0 0 4px; font-size: 20px; }
  main h3 { margin: 22px 0 4px; font-size: 16px; }
  .lib-note { color: var(--lib-dim); margin: 0 0 10px; max-width: 900px; }
  .lib-tabs { display: flex; gap: 4px; margin: 12px 0; }
  .lib-tabs button { background: transparent; border: 1px solid var(--lib-line); border-radius: 4px; padding: 4px 12px;
    cursor: pointer; color: var(--lib-dim); }
  .lib-tabs button[aria-selected="true"] { color: var(--lib-text); background: var(--lib-panel); border-color: var(--lib-accent); }
  .lib-later { border: 1px dashed var(--lib-line); border-radius: 8px; padding: 24px; color: var(--lib-dim); max-width: 700px; }

  /* a token's name: click copies it */
  .lib-name { font: 12px system-ui, sans-serif; color: var(--lib-accent); background: none; border: none; padding: 0;
    cursor: copy; text-align: left; word-break: break-all; }
  .lib-name:hover { text-decoration: underline; }
  .lib-mono { font: 12px system-ui, sans-serif; }
  .lib-dim { color: var(--lib-dim); }

  /* colours */
  .lib-swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .lib-swatch { display: flex; gap: 8px; background: var(--lib-panel); border: 1px solid var(--lib-line); border-radius: 6px;
    padding: 6px; }
  .lib-chip { width: 44px; height: 44px; flex: none; border-radius: 4px; border: 1px solid #0006; }
  .lib-swatch-text { min-width: 0; display: flex; flex-direction: column; gap: 1px; font-size: 12px; }
  .lib-doc-row { display: grid; grid-template-columns: 28px 80px 1fr; gap: 8px; align-items: center; padding: 3px 0;
    border-bottom: 1px solid var(--lib-line); font-size: 12px; }
  .lib-doc-row .lib-chip { width: 24px; height: 24px; }
  .lib-doc-tokens { grid-column: 3; display: flex; gap: 8px; flex-wrap: wrap; }

  /* fonts */
  .lib-font { background: var(--lib-panel); border: 1px solid var(--lib-line); border-radius: 6px; padding: 10px 12px;
    margin: 0 0 10px; }
  .lib-font-sample { color: #fff; margin: 6px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: #0c0d10; padding: 4px 8px; border-radius: 4px; }
  .lib-fail { color: #ff7b7b; }

  /* layers */
  .lib-layers { display: flex; flex-direction: column-reverse; gap: 4px; max-width: 900px; }
  .lib-layer { display: grid; grid-template-columns: 60px 200px 1fr; gap: 10px; align-items: baseline;
    background: var(--lib-panel); border: 1px solid var(--lib-line); border-left: 4px solid var(--lib-accent);
    border-radius: 4px; padding: 6px 10px; }
  .lib-layer b { font: 600 14px system-ui, sans-serif; }

  /* stories: each state on a dark stage, the team button's label placed the Shop's way (css/bw-shop.css) */
  .lib-states { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0; }
  .lib-state { margin: 0; background: var(--lib-panel); border: 1px solid var(--lib-line); border-radius: 6px; padding: 8px; }
  .lib-state figcaption { color: var(--lib-dim); font-size: 12px; margin-top: 6px; }
  .lib-stage { display: inline-block; background: #0c0d10; padding: 12px; border-radius: 4px; }
  .lib-stage-rounded .hud-team-button-label { position: absolute; left: 21px; top: 12px; font: 27.1429px/30px 'GameFont', monospace;
    white-space: nowrap; text-shadow: 2px 0 0 var(--color-hud-outline), -2px 0 0 var(--color-hud-outline),
    0 2px 0 var(--color-hud-outline), 0 -2px 0 var(--color-hud-outline), 2px 2px 0 var(--color-hud-outline),
    -2px 2px 0 var(--color-hud-outline), 2px -2px 0 var(--color-hud-outline), -2px -2px 0 var(--color-hud-outline); }
  .lib-stage-rounded .hud-team-button[disabled] { opacity: 0.4; cursor: default; }
  /* panels: a pixel panel is placed by its screen, so it sits in the flow here; the card's text is the Shop's font */
  .lib-stage-panel .pm-box { position: relative; }
  .lib-stage-card { font-family: 'GameFont', monospace; font-synthesis: none; color: #ffffff; }
  .lib-card-picture { width: 64px; height: 64px; border-radius: 50%; background: var(--color-hud-slate); }
  /* squares and the run item box: placeholder pictures; the box is placed by its screen, so it sits in the flow here */
  .lib-square-picture { border-radius: 50%; background: var(--color-hud-paperEdge); }
  .lib-stage-card-h { font-family: 'HudText', monospace; font-synthesis: none; color: #ffffff; }
  .lib-stage-card-h .hud-run-item { position: relative; }
  /* bars: the life bar's HP label is HUD text; a timer is placed in a box its width */
  .lib-stage-bar { font-family: 'HudText', monospace; font-synthesis: none; color: #ffffff; padding-top: 20px; }
  .lib-stage-timer { position: relative; width: 160px; height: 14px; box-sizing: content-box; }
  /* the dialog sits in the flow here (the game centres it on the menu stage) */
  .lib-stage-modal .modal-dialog { position: relative; left: auto; top: auto; transform: none; }
  /* the slanted panel and the portraits are placed by their screens, so they sit in the flow here */
  .lib-stage-slanted-panel .panel-slanted, .lib-stage-portrait .portrait-round, .lib-stage-portrait .portrait-ringed {
    position: relative; }
  .lib-stage-slanted-panel { font-family: 'HudText', monospace; font-synthesis: none; color: #ffffff; }
  .lib-slanted-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 24px; line-height: 24px; }
  .lib-facts { display: grid; grid-template-columns: 90px 1fr; gap: 4px 12px; margin: 6px 0 0; max-width: 1000px; font-size: 13px; }
  .lib-facts dt { color: var(--lib-dim); }
  .lib-facts dd { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .lib-props { border-collapse: collapse; margin: 4px 0 10px; max-width: 1000px; font-size: 13px; }
  .lib-props th, .lib-props td { border: 1px solid var(--lib-line); padding: 4px 8px; text-align: left; vertical-align: top; }
  .lib-props th { color: var(--lib-dim); font-weight: 600; }
  .lib-colour-table { max-width: none; }
  .lib-colour-chip { width: 48px; height: 24px; border-radius: 4px; border: 1px solid var(--lib-line); }
  .lib-colour-table td:nth-child(3) .lib-name { display: block; }
  .lib-colour-code div { margin: 0 0 2px; }
  .lib-colour-code b { color: var(--lib-dim); font-weight: 600; }
  .lib-colour-code summary { cursor: pointer; color: var(--lib-dim); }
  .lib-story h4 { margin: 10px 0 2px; font-size: 13px; font-weight: 600; }

  #copied { position: fixed; bottom: 16px; right: 16px; background: var(--lib-panel); border: 1px solid var(--lib-accent);
    border-radius: 6px; padding: 6px 12px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  #copied.shown { opacity: 1; }
</style>

<body>
<header>
  <button id="toggle-sidebar" type="button" title="Show or hide the sidebar">&larr;</button>
  <h1>PokeSwarm UI Library</h1>
  <span class="lib-crumb" id="crumb"></span>
</header>
<div class="lib-body">
  <nav id="sidebar"></nav>
  <main id="main"></main>
</div>
<div id="copied"></div>

<script>
'use strict';
const ROOT = '../'; // the repo root, from tools/
const $ = (id) => document.getElementById(id);
const esc = (text) => String(text).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const nameButton = (name) => `<button type="button" class="lib-name" data-copy="${esc(name)}">${esc(name)}</button>`;

// ---------- the sidebar (Jess's mockup) ----------
// later: the step or slice that builds the page; a later page shows that instead of content.
const NAV = [
  { title: 'Tokens', items: [
    { id: 'tokens/colours', title: 'Colours' },
    { id: 'tokens/fonts', title: 'Fonts' },
    { id: 'tokens/layers', title: 'z-index layers' },
  ] },
  { title: 'Primitives', items: [
    { id: 'primitives/buttons', title: 'Buttons' },
    { id: 'primitives/panels', title: 'Panels' },
    { id: 'primitives/squares', title: 'Squares' },
    { id: 'primitives/bars', title: 'Bars' },
    { id: 'primitives/modal', title: 'Modal' },
    { id: 'primitives/portraits', title: 'Portraits' },
  ] },
  { title: 'Composites', groups: [
    { title: 'HUD', items: [
      { id: 'run.hud.healthBar', title: 'run.hud.healthBar', later: 'a later slice under #126' },
      { id: 'run.hud.portrait', title: 'run.hud.portrait', later: 'a later slice under #126' },
      { id: 'run.hud.teamSlot', title: 'run.hud.teamSlot', later: 'a later slice under #126' },
    ] },
    { title: 'Menus', items: [
      { id: 'main.shop.pokeball', title: 'main.shop.pokeball', later: '#155 step 155d' },
      { id: 'main.shop.character', title: 'main.shop.character', later: 'a later slice under #126' },
    ] },
    { title: 'Pause', items: [
      { id: 'pause.pokemonDetail', title: 'pause.pokemonDetail', later: 'a later slice under #126' },
      { id: 'pause.runInfo', title: 'pause.runInfo', later: 'a later slice under #126' },
      { id: 'pause.inventory', title: 'pause.inventory', later: 'a later slice under #126' },
    ] },
  ] },
];
const EDITOR = { id: 'editor', title: 'Basic Editor', later: 'its own slice, after #155' };
const pages = new Map();
const addPages = (items) => items.forEach((item) => pages.set(item.id, item));
NAV.forEach((group) => {
  if (group.items) addPages(group.items);
  (group.groups || []).forEach((sub) => addPages(sub.items));
});
pages.set(EDITOR.id, EDITOR);

const navItem = (item, extra = '') =>
  `<button type="button" class="nav-item${item.later ? ' is-later' : ''}${extra}" data-page="${esc(item.id)}">${esc(item.title)}</button>`;
const navGroup = (group) => `<details class="nav-group" open><summary>${esc(group.title)}</summary>
  ${(group.items || []).map((item) => navItem(item)).join('')}
  ${(group.groups || []).map(navGroup).join('')}</details>`;
$('sidebar').innerHTML = NAV.map(navGroup).join('') + navItem(EDITOR, ' is-top');

// ---------- copy a name ----------
function copyName(name) {
  const done = () => {
    const note = $('copied');
    note.textContent = 'Copied ' + name;
    note.classList.add('shown');
    clearTimeout(copyName.timer);
    copyName.timer = setTimeout(() => note.classList.remove('shown'), 1200);
  };
  const fallback = () => {
    const field = document.createElement('textarea');
    field.value = name;
    document.body.appendChild(field);
    field.select();
    try { document.execCommand('copy'); } catch (error) { /* the toast still names it */ }
    field.remove();
    done();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(name).then(done, fallback);
  else fallback();
}

// ---------- pages ----------
/** A page with tabs along the top: the tab asked for (or the first), its note if it has one, then what it draws. */
function tabbedPage(title, tabs, tab) {
  const shown = tabs.find((entry) => entry.id === tab) || tabs[0];
  return `<h2>${esc(title)}</h2>
    <div class="lib-tabs" role="tablist">${tabs.map((entry) =>
      `<button type="button" role="tab" data-tab="${entry.id}" aria-selected="${entry === shown}">${esc(entry.title)}</button>`).join('')}</div>
    ${shown.note ? `<p class="lib-note">${esc(shown.note)}</p>` : ''}${shown.draw()}`;
}
// Colours (Jess 2026-11-18): two tabs, Unified (the scheme) and Fold Map (today's colours to Unified). The kits below
// hold today's colours (the old Colours 2.0 Used in Game tab); the Fold Map reads them. The game reads nothing here.
/** An rgba() colour as its #hex and alpha (labelRefused is white at 45%); null for a plain #hex. */
function seeThrough(value) {
  const parts = value.startsWith('rgba') ? value.match(/[\d.]+/g).map(Number) : null;
  if (!parts) return null;
  const hex = '#' + parts.slice(0, 3).map((channel) => channel.toString(16).padStart(2, '0')).join('');
  return { hex, alpha: parts[3] };
}
/** A colour's HSL saturation and lightness (0 to 1). */
function hslOf(hex) {
  const see = seeThrough(hex);
  if (see) return { saturation: 0, lightness: see.alpha };
  const [r, g, b] = [1, 3, 5].map((index) => parseInt(hex.slice(index, index + 2), 16) / 255);
  const max = Math.max(r, g, b),
    min = Math.min(r, g, b),
    lightness = (max + min) / 2;
  const saturation = max === min ? 0 : (max - min) / (1 - Math.abs(2 * lightness - 1));
  return { saturation, lightness };
}
// Under 6% saturation counts as a grey: the divider (#495151, 5.3%) is one; the Dark type's light tone (#998b8c, 6.4%)
// is not, so its ramp stays in order
const GREY_SATURATION = 0.06;
/** Swatch order (Jess 2026-11-18): greys first, then the coloured ones, each dark to light by HSL lightness. */
function swatchOrder(a, b) {
  const one = hslOf(a.hex),
    two = hslOf(b.hex);
  const greyFirst = (one.saturation >= GREY_SATURATION) - (two.saturation >= GREY_SATURATION);
  return greyFirst || one.lightness - two.lightness;
}
const SWATCH_COLOUR_WIDTH = 50, // px: the color.hudPanel baseline (350 px for 7); a colour is never thinner
  SWATCH_MIN_WIDTH = 200; // px: the white bar's room for the longest name (.trackLight) and a #HEX
/** A swatch (tools/library/swatch.css): its header (color.hudPanel.*), the colours side by side, dark to light, 50 px
 *  each, then its story info (the job, and the tokens.js tokens it reads today), wrapped to the swatch's width.
 *  Hovering a colour shows its name (.body) and #HEX in the white bar; clicking one copies its #HEX.
 *  group: { label, job, colours: [[part, token, hex], ...] }; a part is the name after the label, in camelCase (body,
 *  trackLight); hex, if given, is the prototype's new value in place of the token's (the info line shows both).
 *  Order: greys first, then the coloured ones, each dark to light by HSL lightness (swatchOrder).
 *  A colour the game writes as a raw hex has no token: [part, null, hex], and the group says where (written: 'file'). */
/** What the white bar shows for a colour: its #hex, or "#ffffff 45%" for a see-through one. */
const shown = (value) => {
  const see = seeThrough(value);
  return see ? see.hex + ' ' + Math.round(see.alpha * 100) + '%' : value;
};
/** Every Colours 2.0 swatch, kit by kit. */
const allSwatches = () =>
  [HUD_KIT_SWATCHES, HP_SWATCHES, RIM_SWATCHES, SCROLL_SWATCHES, TEXT_SWATCHES, STATUS_SWATCHES, STAT_SWATCHES,
    EFFECT_SWATCHES, TYPE_SWATCHES].flat();
/** Every Colours 2.0 colour by its full name (color.hudBonus.fill), built once when a page first draws. */
let boardEntries = null;
function boardEntry(name) {
  if (!boardEntries) {
    boardEntries = new Map();
    for (const group of allSwatches()) for (const colour of group.colours) boardEntries.set(group.label + '.' + colour[0], colour);
  }
  return boardEntries.get(name);
}
/** A #hex at an alpha, written the way the game writes see-through colours ("rgba(255, 210, 63, 0.75)"). */
const rgbaOf = (hex, alpha) =>
  `rgba(${[1, 3, 5].map((index) => parseInt(hex.slice(index, index + 2), 16)).join(', ')}, ${alpha})`;
/** A colour's value: [part, name, hex, alpha]. name is a tokens.js token or another Colours 2.0 colour (a shared one);
 *  hex, if given, is the prototype's new value; alpha paints it see-through. */
function valueOf([, name, hex, alpha]) {
  const shared = !hex && name && boardEntry(name);
  const value = (hex || (shared ? valueOf(shared) : G.Tokens.color(name))).toLowerCase();
  return alpha == null ? value : rgbaOf(value, alpha);
}
function swatch(group) {
  const entry = (colour) => ({ part: '.' + colour[0], token: colour[1], hex: valueOf(colour) });
  const colours = group.colours.map(entry).sort(swatchOrder);
  const listed = group.colours;
  const head = `<div class="swatch-head">${group.heading ? esc(group.heading) : nameButton(group.label + '.*')}</div>`;
  const named = listed.filter(([, token]) => token);
  const today = group.from
    ? group.from
    : group.source
    ? 'canon, ' + group.source
    : !named.length
    ? 'no token, written as raw hex in ' + group.written
    : listed
        .map(([, token, hex, alpha]) =>
          !token ? (group.note ? 'new ' : 'no token ') + hex.toLowerCase()
            : boardEntry(token) ? token + (alpha == null ? '' : ' at ' + Math.round(alpha * 100) + '%') + ' (Colours 2.0)'
            : hex ? `${token} (${G.Tokens.color(token).toLowerCase()}, here ${hex.toLowerCase()})` : token)
        .join(', ') + (group.written ? '; written as raw hex in ' + group.written : '') +
      (group.note ? '; ' + group.note : '');
  const info = `<p class="lib-note swatch-info">${esc(group.job)}.
    <span class="lib-dim">Today: ${esc(today)}</span></p>`;
  const width = Math.max(colours.length * SWATCH_COLOUR_WIDTH, SWATCH_MIN_WIDTH);
  return `<div class="swatch-group" style="width:${width}px">` + head + `<div class="swatch">
    <div class="swatch-palette">${colours.map((colour) => `
      <div class="swatch-color" style="background:${esc(colour.hex)}" data-copy="${esc(colour.hex)}"
        data-part="${esc(colour.part)}" data-show="${esc(shown(colour.hex))}"></div>`).join('')}</div>
    <div class="swatch-stats"><span class="swatch-part"></span><span class="swatch-hex"></span></div>
  </div>` + info + '</div>';
}
/** Swatches side by side, wrapping to the next row when the page runs out. */
const swatchRow = (groups) => `<div class="swatch-row">${groups.map(swatch).join('')}</div>`;

// Colours 2.0 groups: prototype names in camelCase (Jess, 2026-11-18), each colour read from today's tokens.js token
const HUD_KIT_SWATCHES = [
  {
    label: 'color.hudPanel',
    job:

/** A #hex in CIE Lab, to say how far apart two colours look. */
function labOf(hex) {
  const linear = (channel) => {
    const value = channel / 255;
    return value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4;
  };
  const [r, g, b] = [1, 3, 5].map((index) => linear(parseInt(hex.slice(index, index + 2), 16)));
  const x = (0.4124 * r + 0.3576 * g + 0.1805 * b) / 0.95047,
    y = 0.2126 * r + 0.7152 * g + 0.0722 * b,
    z = (0.0193 * r + 0.1192 * g + 0.9505 * b) / 1.08883;
  const f = (value) => (value > 0.008856 ? Math.cbrt(value) : 7.787 * value + 16 / 116);
  return [116 * f(y) - 16, 500 * (f(x) - f(y)), 200 * (f(y) - f(z))];
}

 *  and understates greys). About 1 is the smallest step the eye notices; above 5 is clearly different. */
function deltaE(one, two) {

    [L2, a2, b2] = labOf(two);
  const rad = Math.PI / 180,
    pow7 = (value) => value ** 7;
  const meanChroma = (Math.hypot(a1, b1) + Math.hypot(a2, b2)) / 2;
  const g = 0.5 * (1 - Math.sqrt(pow7(meanChroma) / (pow7(meanChroma) + pow7(25))));
  const a1p = (1 + g) * a1,
    a2p = (1 + g) * a2;
  const C1p = Math.hypot(a1p, b1),
    C2p = Math.hypot(a2p, b2);
  const hue = (b, ap) => (b === 0 && ap === 0 ? 0 : (Math.atan2(b, ap) / rad + 360) % 360);
  const h1p = hue(b1, a1p),
    h2p = hue(b2, a2p);
  let dhp = 0;
  if (C1p * C2p !== 0) {
    dhp = h2p - h1p;
    if (dhp > 180) dhp -= 360;
    else if (dhp < -180) dhp += 360;
  }
  const dLp = L2 - L1,
    dCp = C2p - C1p,
    dHp = 2 * Math.sqrt(C1p * C2p) * Math.sin((dhp / 2) * rad);
  const Lbp = (L1 + L2) / 2,
    Cbp = (C1p + C2p) / 2;
  let hbp = h1p + h2p;
  if (C1p * C2p !== 0) {
    if (Math.abs(h1p - h2p) <= 180) hbp = (h1p + h2p) / 2;
    else hbp = h1p + h2p < 360 ? (h1p + h2p + 360) / 2 : (h1p + h2p - 360) / 2;
  }
  const T =
    1 -
    0.17 * Math.cos((hbp - 30) * rad) +
    0.24 * Math.cos(2 * hbp * rad) +
    0.32 * Math.cos((3 * hbp + 6) * rad) -
    0.2 * Math.cos((4 * hbp - 63) * rad);
  const dTheta = 30 * Math.exp(-(((hbp - 275) / 25) ** 2));
  const RC = 2 * Math.sqrt(pow7(Cbp) / (pow7(Cbp) + pow7(25)));
  const SL = 1 + (0.015 * (Lbp - 50) ** 2) / Math.sqrt(20 + (Lbp - 50) ** 2),
    SC = 1 + 0.045 * Cbp,
    SH = 1 + 0.015 * Cbp * T,
    RT = -Math.sin(2 * dTheta * rad) * RC;
  const l = dLp / SL,
    c = dCp / SC,
    h = dHp / SH;

const RAMP_LIGHT = 0.35,

const rampChannels = (hex) => [1, 3, 5].map((index) => parseInt(hex.slice(index, index + 2), 16));
const rampHex = (channels) =>

/** A 3-tone ramp: base is a token or Colours 2.0 name, or a #hex the game writes raw; light and dark come from the
 *  rule unless a name is given for them. */
function accentRamp(base, tones = {}) {
  const raw = base.startsWith('#');
  const value = raw ? base.toLowerCase() : valueOf(['base', base]);
  const tone = (part, name, worked) =>
    name ? (name.startsWith('#') ? [part, null, name.toLowerCase()] : [part, name]) : [part, null, worked];

    tone('light', tones.light, rampLight(value)),
    raw ? ['base', null, value] : ['base', base],
    tone('dark', tones.dark, rampDark(value)),

function unifiedEntries() {

const STAT_NAMES = { Atk: 'Attack', Def: 'Defense', Spa: 'SpecialAttack', Spd: 'SpecialDefense', Spe: 'Speed' };
const solidOf = (value) => (seeThrough(value) ? seeThrough(value).hex : value);
/** Where one colour lands: { key, value } on Unified, or null when nothing resolves it. */
function foldOf(name, value) {
  const swatchName = name.slice(0, name.lastIndexOf('.')),
    part = name.slice(name.lastIndexOf('.') + 1);
  let to = FOLD_TO[name];
  if (!to && /^status(Paralysis|Freeze|Burn|Poison)$/.test(swatchName))
    to = swatchName + '.' + (part === 'fill' ? 'base' : 'dark');
  const stat = swatchName.match(/^stat(Atk|Def|Spa|Spd|Spe)$/);
  if (!to && stat) to = 'stat' + STAT_NAMES[stat[1]] + '.' + (part === 'fill' ? 'base' : 'dark');
  if (!to && /^status(Sleep|Toxic|Minor)$/.test(swatchName)) to = name;
  const entries = unifiedEntries();
  if (to) {
    const [key, alpha] = to.split('@');
    const hit = entries.find((entry) => entry.key === key);
    if (!hit) return null;
    return alpha
      ? { key: key + ' at ' + Math.round(Number(alpha) * 100) + '%', value: rgbaOf(solidOf(hit.value), Number(alpha)) }
      : { key, value: hit.value };
  }
  const exact = entries.find((entry) => entry.value === value);
  if (exact) return { key: exact.key, value: exact.value };
  const step = GREY_FOLD[value];
  if (step) return { key: 'grey.' + step, value: greyTone(step) };
  return null;
}

function foldMapPage() {
  const chip = (value) => (value ? `<div class="lib-colour-chip" style="background:${esc(value)}"></div>` : '');
  const tally = { same: 0, "can't see it": 0, slight: 0, visible: 0, out: 0, missing: [] };
  const row = (name, value, where, landing, note) => {
    let change = '',
      words = note || '';
    if (landing) {
      const difference = deltaE(solidOf(value), solidOf(landing.value));
      words = changeWords(Math.round(difference * 10) / 10 === 0 ? 0 : difference);
      tally[words]++;
      change = difference ? difference.toFixed(1) : '';
    } else if (note) tally.out++;
    else {
      tally.missing.push(name);
      words = 'NO HOME';
    }
    return `<tr><td>${chip(value)}</td><td class="lib-mono">${esc(shown(value))}</td><td>${esc(where)}</td>
      <td>${chip(landing && landing.value)}</td>
      <td>${landing ? nameButton(landing.key) + `<span class="lib-mono"> ${esc(shown(landing.value))}</span>` : ''}</td>
      <td class="lib-mono">${change}</td><td>${esc(words)}</td></tr>`;
  };
  const head = '<thead><tr><th>Today</th><th>#HEX</th><th>Name today</th><th>Unified</th><th></th>' +
    '<th>Change</th><th></th></tr></thead>';
  const table = (rows) => `<table class="lib-props lib-colour-table">${head}<tbody>${rows.join('')}</tbody></table>`;
  const sections = FOLD_KITS.map(([title, swatches, collapse]) => {
    const rows = swatches().flatMap((sw) =>
      sw.colours.map((colour) => {
        const name = unifiedKey(sw.label, colour[0]),
          value = valueOf(colour);
        return row(name, value, name, foldOf(name, value));
      })
    );
    return collapse
      ? `<h3>${esc(title)}</h3><details><summary class="lib-dim">${rows.length} canon type colours, each unchanged
          (show)</summary>${table(rows)}</details>`
      : `<h3>${esc(title)}</h3>` + table(rows);
  });
  const entries = unifiedEntries();
  const outside = FOLD_OUTSIDE.map(([name, value, where, key, note]) => {
    const hit = key && entries.find((entry) => entry.key === key);
    return row(name, value, where, hit ? { key, value: hit.value } : null, note);
  });
  sections.push('<h3>Outside the kits</h3>' + table(outside));
  const total = tally.same + tally["can't see it"] + tally.slight + tally.visible;
  const summary = `<p class="lib-dim">${total} colours land on Unified: ${tally.same} unchanged,
    ${tally["can't see it"]} too close to see, ${tally.slight} slight, ${tally.visible} visible. ${tally.out} stay out on
    purpose. ${tally.missing.length ? 'No home yet: ' + esc(tally.missing.join(', ')) : 'Every colour has a home.'}

  return summary + sections.join('');
}

    note: 'The pixel-art buttons (js/ui/lib/primitives/button/). Props only: the screen passes the label, size, rims and state, and handles the press. Placeholder labels.',
  },
  'primitives/panels': {
    title: 'Panels',
    stories: () => G.Lib.PanelStories,
    pieces: () => G.Lib.Panel,
    note: 'The frames and the cards (js/ui/lib/primitives/panel/). Props only: the screen passes the size, rims and contents (a card gets its picture and its button). Placeholder data.',
  },
  'primitives/bars': {
    title: 'Bars',
    stories: () => G.Lib.BarStories,
    pieces: () => G.Lib.Bar,
    note: 'The life bar and the timer strip (js/ui/lib/primitives/bar/). Props only: the screen passes the size, the fill and its band, the lost pieces, a timer\u2019s time left. Placeholder values.',
  },
  'primitives/modal': {
    title: 'Modal',
    stories: () => G.Lib.ModalStories,
    pieces: () => G.Lib.Modal,
    note: 'The dialog (js/ui/lib/primitives/modal/). Props only: the caller passes the text, the buttons and which one is green; G.UI.ask handles the keys and the answer. Placeholder text.',
  },
  'primitives/portraits': {
    title: 'Portraits',
    stories: () => G.Lib.PortraitStories,
    pieces: () => G.Lib.Portrait,
    note: 'The round portrait (js/ui/lib/primitives/portrait/). Props only: the screen passes the face\u2019s address, size, stroke and rim, a ring\u2019s fill, fainted. Real portraits from assets/pokemon.',
  },
  'primitives/squares': {
    title: 'Squares',
    stories: () => G.Lib.SquareStories,
    pieces: () => G.Lib.Square,
    note: 'The item squares and their grid (js/ui/lib/primitives/square/). Props only: the screen passes each square its picture and each slot its tooltip. Placeholder pictures.',
  },
};
const primitivePage = (id) => () => {
  const page = PRIMITIVE_PAGES[id];
  return `<h2>${esc(page.title)}</h2><p class="lib-note">${esc(page.note)}</p>${page.stories().map(storyBlock).join('')}`;
};

const DRAW = {
  'tokens/colours': coloursPage,
  'tokens/fonts': fontsPage,
  'tokens/layers': layersPage,
  'primitives/buttons': primitivePage('primitives/buttons'),
  'primitives/panels': primitivePage('primitives/panels'),
  'primitives/squares': primitivePage('primitives/squares'),
  'primitives/bars': primitivePage('primitives/bars'),
  'primitives/modal': primitivePage('primitives/modal'),
  'primitives/portraits': primitivePage('primitives/portraits'),
};
// the shared fills the pixel shapes paint with (G.Lib.Pixels.PixelPatterns), once for the whole board
const patternHost = document.createElement('div');
document.body.appendChild(patternHost);
preact.render(libHtml`<${G.Lib.Pixels.PixelPatterns} />`, patternHost);

/** Shows a page (and, on a tabbed page, a tab). The address hash follows, so the page can be bookmarked. */
function show(id, tab) {
  const item = pages.get(id) || pages.get('tokens/colours');
  const draw = DRAW[item.id];
  $('main').innerHTML = draw && !item.later ? draw(tab) : laterPage(item);
  $('main').dataset.page = item.id;
  $('crumb').textContent = item.id;
  document.querySelectorAll('.nav-item').forEach((button) =>
    button.toggleAttribute('aria-current', button.dataset.page === item.id));
  const hash = '#' + item.id + (tab ? ':' + tab : '');
  if (location.hash !== hash) history.replaceState(null, '', hash);
  if (item.id === 'tokens/fonts') markFonts();
  const primitive = PRIMITIVE_PAGES[item.id];
  if (primitive && !item.later) mountStories(primitive.stories(), primitive.pieces());
}

// ---------- fonts: declared from the tokens, as the game's CSS declares them ----------
const kebab = (key) => key.replace(/[A-Z]/g, (letter) => '-' + letter.toLowerCase());
const faceStyle = document.createElement('style');
faceStyle.textContent = G.Tokens.fonts.map((font) => `@font-face { font-family: '${font.family}'; src: url('${ROOT + font.file}') format('truetype');
  font-display: block;${Object.entries(font.faceRules || {}).map(([key, value]) => ` ${kebab(key)}: ${value};`).join('')} }`).join('\n');
document.head.appendChild(faceStyle);
const fontResults = new Map();
window.libFontsReady = Promise.all(G.Tokens.fonts.map((font) =>
  document.fonts.load(`${font.sizes[0] || 20}px '${font.family}'`).then((faces) => faces.length > 0, () => false)
    .then((loaded) => { fontResults.set(font.family, loaded); markFonts(); return [font.family, loaded]; })));
function markFonts() {
  for (const [family, loaded] of fontResults) {
    const status = document.querySelector(`[data-font="${family}"] .lib-font-status`);
    if (!status) continue;
    status.textContent = loaded ? '' : 'did not load';
    status.className = 'lib-font-status' + (loaded ? '' : ' lib-fail');
  }
}

// ---------- wiring ----------
document.addEventListener('click', (event) => {
  const copy = event.target.closest('[data-copy]');
  if (copy) return copyName(copy.dataset.copy);
  // tabs first: the main area itself carries data-page (the page it shows), so a tab click also finds it
  const tab = event.target.closest('[data-tab]');
  if (tab) return show($('main').dataset.page, tab.dataset.tab);
  const nav = event.target.closest('.nav-item[data-page]');
  if (nav) return show(nav.dataset.page);
});
// a swatch's footer: the hovered colour's name and #HEX, cleared when the mouse leaves the colours
document.addEventListener('pointerover', (event) => {
  const colour = event.target.closest('.swatch-color');
  if (!colour) return;
  const footer = colour.closest('.swatch');
  footer.querySelector('.swatch-part').textContent = colour.dataset.part;
  footer.querySelector('.swatch-hex').textContent = colour.dataset.show || colour.dataset.copy;
});
document.addEventListener('pointerout', (event) => {
  const palette = event.target.closest('.swatch-palette');
  if (!palette || palette.contains(event.relatedTarget)) return;
  const footer = palette.closest('.swatch');
  footer.querySelector('.swatch-part').textContent = '';
  footer.querySelector('.swatch-hex').textContent = '';
});
// The board writes nothing to localStorage: file:// pages share it with the game's save.
function setSidebar(open) {
  document.body.classList.toggle('sidebar-closed', !open);
  $('toggle-sidebar').innerHTML = open ? '&larr;' : '&rarr;';
}
$('toggle-sidebar').addEventListener('click', () => setSidebar(document.body.classList.contains('sidebar-closed')));

const fromHash = () => {
  const [id, tab] = decodeURIComponent(location.hash.slice(1)).split(':');
  show(id || 'tokens/colours', tab);
};
addEventListener('hashchange', fromHash);
fromHash();

// for tools/smoke-ui-library.js
window.libPages = [...pages.keys()];
window.libTabs = Object.fromEntries(
  [['tokens/colours', COLOUR_TABS]].map(([id, tabs]) => [id, tabs.map((tab) => tab.id)]));
window.libShow = (id, tab) => { show(id, tab); return $('main').innerText; };
</script>
</body>
</html>
